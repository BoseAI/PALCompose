<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>PalComposeTOOL 3D</title>
  <link rel="stylesheet" href="./style/style.css">
  <style>
    #toolbar3D { position:absolute; left:10px; top:10px; display:flex; gap:8px; z-index:2; }
    #toolbar3D button { height:70px; }
    #toolbar3D .txtBtn { width:110px; font-size:15px; font-weight:600; }
    #info3D { position:absolute; right:12px; bottom:10px; font:13px "Source Sans Pro", system-ui, sans-serif; color:#333;
              background:rgba(255,255,255,.8); padding:6px 10px; border-radius:6px; pointer-events:none; }
    /* Caricamento: visibile subito, sparisce al primo disegno della scena */
    #loader3D { position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
                background:#e6eaee; z-index:1; font:600 18px "Source Sans Pro", system-ui, sans-serif; color:#023047; }
    #loader3D .spinner { width:64px; height:64px; border:7px solid #c9d2da; border-top-color:#09CCB5; border-radius:50%;
                         animation:spin3D 0.9s linear infinite; margin-bottom:18px; }
    #loader3D.error .spinner { display:none; }
    #loader3D.error { color:#EA053A; text-align:center; padding:0 40px; }
    #loader3D .detail { margin-top:10px; font-weight:400; font-size:14px; color:#333; max-width:700px; word-break:break-word; }
    @keyframes spin3D { to { transform:rotate(360deg); } }
    /* Barra simulazione robot */
    #simBar { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); z-index:2; display:none; align-items:center;
              padding:8px 12px; background:rgba(255,255,255,0.92); border:1px solid #d5dbe1; border-radius:12px;
              box-shadow:0 4px 14px rgba(2,48,71,0.25); font:600 14px "Source Sans Pro", system-ui, sans-serif; color:#023047; }
    #simBar > * { margin-right:8px; }
    #simBar > *:last-child { margin-right:0; }
    #simBar .simBtn { width:56px; height:48px; padding:0; font-size:18px; }
    #simSlider { width:240px; padding:0; }
    #simSpeed { width:70px; height:40px; padding:0 6px; font-size:16px; }
    #simStatus { min-width:190px; }
    #info3D { bottom:auto; top:12px; }
  </style>
</head>
<body>

<div id="toolbar3D">
  <button id="2D" class="defaultnormale" style="display:flex; align-items:center; justify-content:center; padding:12; width:100px;">
    <img id="svgPressed2D" src="Assets/Icon/2D_Notpressed.svg" style="width:100%; height:100%; transform: translate(0%, 15%);">
    <img id="svgNormal2D" src="Assets/Icon/2D_pressed.svg" style="width:100%; height:100%; transform: translate(0%, 15%);">
  </button>
  <button id="btnTopView" class="defaultnormale txtBtn">Top view</button>
  <button id="btnLabels" class="defaultabilitato txtBtn">Labels</button>
  <button id="btnRobot" class="defaultnormale txtBtn">Robot</button>
</div>

<!-- Comandi della simulazione robot (visibili con il pulsante Robot) -->
<div id="simBar">
  <button id="simStart" class="defaultnormale simBtn" title="Start">|&#9664;</button>
  <button id="simPrev" class="defaultnormale simBtn" title="Previous deposit">&#9664;&#9664;</button>
  <button id="simPlay" class="defaultnormale simBtn" title="Play / Pause">&#9654;</button>
  <button id="simNext" class="defaultnormale simBtn" title="Next deposit">&#9654;&#9654;</button>
  <button id="simEnd" class="defaultnormale simBtn" title="End">&#9654;|</button>
  <input id="simSlider" type="range" min="0" max="1000" value="0">
  <select id="simSpeed">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="2">2x</option>
    <option value="4">4x</option>
  </select>
  <div id="simStatus"></div>
</div>
<div id="info3D"></div>
<div id="loader3D"><div class="spinner"></div><div id="loaderText">Loading 3D view...</div><div id="loaderDetail" class="detail"></div></div>

<script>
  // Qualsiasi errore durante il caricamento viene mostrato al posto della rotellina (niente pagina vuota)
  function show3DError(title, detail) {
    var l = document.getElementById("loader3D");
    if (!l) return;
    l.className = "error";
    l.style.display = "flex";
    document.getElementById("loaderText").textContent = title;
    document.getElementById("loaderDetail").textContent = detail || "";
  }
  window.onerror = function (msg, src, line) {
    if (src && /models\.js$/.test(src)) return false;          // modelli facoltativi
    show3DError("3D view error", msg + (src ? " (" + src.split("/").pop() + ":" + line + ")" : ""));
    return false;
  };
  window.addEventListener("error", function (e) {              // file non trovati (script)
    var t = e.target;
    if (t && t.tagName === "SCRIPT" && !/models\.js$/.test(t.src)) show3DError("File not found", t.src.split("/").slice(-3).join("/"));
  }, true);
</script>

<!-- three.js in versione classica (non modulo): funziona anche da file:/// senza server -->
<script src="./libs/three/three.bundle.js"></script>
<script src="./Functions/3d/scene3d.js"></script>
<script src="./Functions/3d/robot3d.js"></script>
<script src="./Functions/3d/sim3d.js"></script>
</body>
</html>
