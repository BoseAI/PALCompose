<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>PalComposeTOOL 3D</title>
  <link rel="stylesheet" href="./style/style3D.css">
  <style>
    #toolbar3D { position:absolute; left:10px; top:10px; display:flex; gap:8px; z-index:2; }
    #toolbar3D button { height:70px; }
    #toolbar3D .txtBtn { width:110px; font-size:15px; font-weight:600; }
    #info3D { position:absolute; right:12px; bottom:10px; font:13px "Source Sans Pro", system-ui, sans-serif; color:#333;
              background:rgba(255,255,255,.8); padding:6px 10px; border-radius:6px; pointer-events:none; }
  </style>
</head>
<body>

<div id="toolbar3D">
  <button id="2D" class="defaultnormale" style="display:flex; align-items:center; justify-content:center; padding:12; width:100px;">
    <img id="svgPressed2D" src="Assets/Icon/2D_Notpressed.svg" style="width:100%; height:100%; transform: translate(0%, 15%);">
    <img id="svgNormal2D" src="Assets/Icon/2D_pressed.svg" style="width:100%; height:100%; transform: translate(0%, 15%);">
  </button>
  <button id="btnTopView" class="defaultnormale txtBtn">Top view</button>
  <button id="btnLabels" class="defaultabilitato txtBtn">Labels</button>
</div>
<div id="info3D"></div>

<!-- three.js in versione classica (non modulo): funziona anche da file:/// senza server -->
<script src="./libs/three/three.bundle.js"></script>
<!-- Facoltativo: modelli 3D incorporati generati con tools/embed-models.bat (robot). Se manca, la pagina funziona lo stesso -->
<script src="./Assets/3D/models.js"></script>
<script>
(function () {
  "use strict";

  var state = null;
  try { state = JSON.parse(sessionStorage.getItem("state") || "null"); } catch (e) { state = null; }

  // ===== BOTTONI =====
  function setupButtonWithSVG3D(button, svgNormal, svgPressed) {
    svgNormal = document.getElementById(svgNormal);
    svgPressed = document.getElementById(svgPressed);
    function press() { svgNormal.style.display = 'block'; svgPressed.style.display = 'none'; }
    function release() { svgNormal.style.display = 'none'; svgPressed.style.display = 'block'; }
    button.addEventListener('pointerdown', press);
    button.addEventListener('pointerup', release);
    button.addEventListener('pointerleave', release);
    release();
  }
  setupButtonWithSVG3D(document.getElementById("2D"), 'svgNormal2D', 'svgPressed2D');
  document.getElementById("2D").onclick = function () { window.location.href = "Index.html"; };

  if (!state || !state.boxes) {
    document.getElementById("info3D").textContent = "No configuration data";
    return;
  }

  // ===== COSTANTI (mm) =====
  var MM = 0.001;              // la scena è in metri
  var PALLET_HEIGHT = 144;
  var CASE_HEIGHT = 300;       // altezza cassa (non disponibile dal PLC)
  var CASE_GAP = 6;            // fessura visiva tra casse adiacenti
  var palletW = state.palletReal.w, palletH = state.palletReal.h;

  // ===== RENDERER / SCENA =====
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.9;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe6eaee);
  scene.fog = new THREE.Fog(0xe6eaee, span * 4, span * 9);
  var pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.35;

  var span = Math.max(palletW, palletH) * MM;
  var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
  var target = new THREE.Vector3(0, (PALLET_HEIGHT + CASE_HEIGHT / 2) * MM, 0);
  function defaultView() { camera.position.set(span * 0.9, span * 1.1, span * 1.4); controls.target.copy(target); controls.update(); }

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = false;
  controls.maxPolarAngle = Math.PI / 2 - 0.02;   // non sotto il pavimento
  controls.minDistance = span * 0.4;
  controls.maxDistance = span * 6;
  defaultView();

  // ===== LUCI =====
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f99, 0.35));
  var sun = new THREE.DirectionalLight(0xfff4e5, 2.6);
  sun.position.set(span * 1.2, span * 2.5, span * 1.6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0005;
  var sc = sun.shadow.camera;
  sc.left = sc.bottom = -span * 1.5; sc.right = sc.top = span * 1.5; sc.near = 0.1; sc.far = span * 8;
  scene.add(sun);

  // ===== PAVIMENTO =====
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(span * 12, span * 12),
                             new THREE.MeshStandardMaterial({ color: 0xd5dae0, roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  var grid = new THREE.GridHelper(span * 4, 16, 0xb9c0c8, 0xc9cfd6);
  grid.position.y = 0.0005;
  scene.add(grid);

  // ===== TEXTURE PROCEDURALI =====
  function canvasTexture(size, paint) {
    var c = document.createElement("canvas");
    c.width = c.height = size;
    paint(c.getContext("2d"), size);
    var t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }
  function rand(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  function paintKraft(g, s, seed) {
    var r = rand(seed || 7);
    g.fillStyle = "#b8864a"; g.fillRect(0, 0, s, s);
    for (var i = 0; i < 1800; i++) {                       // fibre del cartone
      g.fillStyle = r() < 0.5 ? "rgba(120,80,35,0.10)" : "rgba(255,235,200,0.10)";
      g.fillRect(r() * s, r() * s, 1 + r() * 3, 1);
    }
    g.strokeStyle = "rgba(90,58,25,0.55)"; g.lineWidth = s * 0.02;  // bordo scuro per leggere gli spigoli
    g.strokeRect(0, 0, s, s);
  }
  function paintTape(g, s, alongX) {
    var tw = s * 0.2;
    g.fillStyle = "rgba(222,190,135,0.9)";
    if (alongX) g.fillRect(0, (s - tw) / 2, s, tw); else g.fillRect((s - tw) / 2, 0, tw, s);
    g.strokeStyle = "rgba(150,110,60,0.5)"; g.lineWidth = 1.5;
    if (alongX) { g.strokeRect(-2, (s - tw) / 2, s + 4, tw); } else { g.strokeRect((s - tw) / 2, -2, tw, s + 4); }
    g.strokeStyle = "rgba(110,72,30,0.6)"; g.lineWidth = 2;   // linea di chiusura dei lembi
    g.beginPath();
    if (alongX) { g.moveTo(0, s / 2); g.lineTo(s, s / 2); } else { g.moveTo(s / 2, 0); g.lineTo(s / 2, s); }
    g.stroke();
  }
  // Etichetta rettangolare (texture 512x256 = proporzione 2:1, si adatta a laterale e ad angolo)
  function paintLabel(g, w, h) {
    g.fillStyle = "#fbfbf7"; g.fillRect(0, 0, w, h);
    g.strokeStyle = "#9aa1a8"; g.lineWidth = 4; g.strokeRect(2, 2, w - 4, h - 4);
    g.fillStyle = "#222";
    var r = rand(11);
    for (var bx = w * 0.06; bx < w * 0.94; bx += 3 + Math.floor(r() * 4)) g.fillRect(bx, h * 0.52, 1 + Math.floor(r() * 3), h * 0.34);
    g.fillRect(w * 0.06, h * 0.12, w * 0.5, h * 0.09);
    g.fillRect(w * 0.06, h * 0.27, w * 0.32, h * 0.07);
    g.fillRect(w * 0.62, h * 0.12, w * 0.3, h * 0.22);
    g.fillStyle = "#fbfbf7"; g.fillRect(w * 0.64, h * 0.14, w * 0.26, h * 0.18);
    g.fillStyle = "#222"; g.font = "bold " + Math.round(h * 0.14) + "px Arial"; g.fillText("SSCC", w * 0.66, h * 0.29);
  }

  // ===== PALLET (legno, generato) =====
  var woodTex = canvasTexture(256, function (g, s) {
    var r = rand(3);
    g.fillStyle = "#c9a36e"; g.fillRect(0, 0, s, s);
    for (var i = 0; i < 70; i++) {
      g.strokeStyle = "rgba(" + (110 + r() * 40 | 0) + "," + (75 + r() * 25 | 0) + ",40," + (0.15 + r() * 0.25) + ")";
      g.lineWidth = 0.5 + r() * 2;
      var y0 = r() * s;
      g.beginPath(); g.moveTo(0, y0);
      g.bezierCurveTo(s * 0.3, y0 + (r() - 0.5) * 12, s * 0.7, y0 + (r() - 0.5) * 12, s, y0 + (r() - 0.5) * 6);
      g.stroke();
    }
  });
  woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
  var woodMat = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 });
  var blockMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0xd8c8a8, roughness: 0.9 });

  var pallet = new THREE.Group();
  function addBoard(cx, cy, cz, sx, sy, sz, mat) {   // mm, centro in coordinate pallet (x destra, z verso l'operatore)
    var m = new THREE.Mesh(new THREE.BoxGeometry(sx * MM, sy * MM, sz * MM), mat);
    m.position.set(cx * MM, cy * MM, cz * MM);
    m.castShadow = m.receiveShadow = true;
    pallet.add(m);
  }
  (function buildPallet() {
    var T = 22, BLOCK = 78;
    var colsX = [-palletW / 2 + 72.5, 0, palletW / 2 - 72.5];   // file di blocchi lungo X
    var rowsZ = [-palletH / 2 + 50, 0, palletH / 2 - 50];       // file di blocchi lungo Z
    rowsZ.forEach(function (z) { addBoard(0, T / 2, z, palletW, T, 100, woodMat); });                 // assi inferiori
    colsX.forEach(function (x) { rowsZ.forEach(function (z) { addBoard(x, T + BLOCK / 2, z, 145, BLOCK, 100, blockMat); }); }); // blocchi
    colsX.forEach(function (x) { addBoard(x, T + BLOCK + T / 2, 0, 145, T, palletH, woodMat); });     // traverse
    var n = 5, widths = [145, 100, 145, 100, 145];                                                  // assi superiori
    var free = (palletH - widths.reduce(function (a, b) { return a + b; }, 0)) / (n - 1);
    var z = -palletH / 2;
    for (var i = 0; i < n; i++) { addBoard(0, PALLET_HEIGHT - T / 2, z + widths[i] / 2, palletW, T, widths[i], woodMat); z += widths[i] + free; }
  })();
  scene.add(pallet);

  // ===== CASSE =====
  // Ogni deposito è diviso nelle casse che lo compongono (stessa logica di getCaseGrid nel 2D)
  function getCaseGrid(box) {
    var cw = state.boxSize.w, ch = state.boxSize.h;
    if (!(cw > 0) || !(ch > 0)) return null;
    function fit(a, b, rotated) {
      var nx = Math.round(box.w / a), ny = Math.round(box.h / b);
      if (nx < 1 || ny < 1) return null;
      return { nx: nx, ny: ny, cw: a, ch: b, rotated: rotated, err: Math.abs(box.w - nx * a) + Math.abs(box.h - ny * b) };
    }
    var f1 = fit(cw, ch, false), f2 = fit(ch, cw, true);
    var best = !f1 ? f2 : !f2 ? f1 : (f2.err < f1.err ? f2 : f1);
    if (!best || best.err > Math.max(cw, ch) * 0.25 || best.nx * best.ny > 100) return null;
    return best;
  }

  // Rotazione della singola cassa: quella del deposito, +90° se le casse sono girate rispetto al deposito (picking wheel)
  function getCaseAngle(box, grid) {
    var a = Number(box.angle) || 0;
    if (grid && grid.rotated !== (a % 180 === 90)) a = (a + 90) % 360;
    return a;
  }

  var caseW = state.boxSize.w, caseD = state.boxSize.h;
  var kraft = canvasTexture(256, function (g, s) { paintKraft(g, s, 7); });
  var kraftTop = canvasTexture(256, function (g, s) { paintKraft(g, s, 9); paintTape(g, s, caseW >= caseD); });
  var matSide = new THREE.MeshStandardMaterial({ map: kraft, roughness: 0.9 });
  var caseMaterials = [matSide, matSide,                                               // +x, -x
                       new THREE.MeshStandardMaterial({ map: kraftTop, roughness: 0.85 }), matSide, // +y, -y
                       matSide, matSide];                                                       // +z, -z

  // pezzi singoli: un'unica geometria per tutte le casse (InstancedMesh = una sola chiamata di disegno)
  var instances = [];
  var fallbackDeposits = [];
  state.boxes.forEach(function (box) {
    var cx = box.x + box.w / 2 - palletW / 2 + state.Offset.x;
    var cz = -(box.y + box.h / 2 - palletH / 2 + state.Offset.y);
    var g = getCaseGrid(box);
    if (!g) { fallbackDeposits.push({ box: box, cx: cx, cz: cz }); return; }
    var stepX = box.w / g.nx, stepZ = box.h / g.ny;
    var yaw = getCaseAngle(box, g) * Math.PI / 180;
    for (var i = 0; i < g.nx; i++) {
      for (var j = 0; j < g.ny; j++) {
        instances.push({ x: cx - box.w / 2 + stepX * (i + 0.5), z: cz + box.h / 2 - stepZ * (j + 0.5), yaw: yaw });
      }
    }
  });

  if (instances.length) {
    var caseGeo = new THREE.BoxGeometry((caseW - CASE_GAP) * MM, CASE_HEIGHT * MM, (caseD - CASE_GAP) * MM);
    var cases = new THREE.InstancedMesh(caseGeo, caseMaterials, instances.length);
    var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), one = new THREE.Vector3(1, 1, 1);
    instances.forEach(function (it, k) {
      q.setFromAxisAngle(up, it.yaw);
      m4.compose(new THREE.Vector3(it.x * MM, (PALLET_HEIGHT + CASE_HEIGHT / 2) * MM, it.z * MM), q, one);
      cases.setMatrixAt(k, m4);
    });
    cases.castShadow = cases.receiveShadow = true;
    scene.add(cases);
    addCaseLabels();
  }

  // ===== ETICHETTE SULLE CASSE =====
  // Cassa a 0° vista dall'alto: lato destro = +X, lato alto (2D) = -Z.
  // CornerLabelling = true  -> etichetta piegata sull'angolo destra/alto (metà su +X, metà su -Z)
  // CornerLabelling = false -> etichetta laterale al centro del lato destro (+X)
  function addCaseLabels() {
    var LABEL_H = 100, LABEL_SIDE_LEN = 150, LABEL_CORNER_LEN = 100, OUT = 0.8; // mm
    var cw = caseW - CASE_GAP, cd = caseD - CASE_GAP;
    var cy = CASE_HEIGHT * 0.12;                       // centro etichetta rispetto al centro cassa
    var lh = Math.min(LABEL_H, CASE_HEIGHT * 0.6);
    var labelTex = (function () {
      var c = document.createElement("canvas"); c.width = 512; c.height = 256;
      paintLabel(c.getContext("2d"), 512, 256);
      var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return t;
    })();
    var labelMat = new THREE.MeshStandardMaterial({ map: labelTex, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2 });
    function plane(len, u0, u1) {                      // piano con una porzione orizzontale della texture
      var geo = new THREE.PlaneGeometry(len * MM, lh * MM);
      var uv = geo.attributes.uv;
      for (var i = 0; i < uv.count; i++) uv.setX(i, u0 + uv.getX(i) * (u1 - u0));
      return geo;
    }
    var parts = [];                                    // [geometria, matrice locale nella cassa]
    var local = new THREE.Matrix4(), rot = new THREE.Matrix4();
    if (state.CornerLabelling) {
      var lc = Math.min(LABEL_CORNER_LEN, cw * 0.9, cd * 0.9);
      // metà sul lato -Z (alto in 2D) e metà sul lato +X: la texture continua attorno allo spigolo
      rot.makeRotationY(Math.PI);
      parts.push([plane(lc, 0.5, 1), new THREE.Matrix4().makeTranslation((cw / 2 - lc / 2) * MM, cy * MM, (-cd / 2 - OUT) * MM).multiply(rot.clone())]);
      rot.makeRotationY(Math.PI / 2);
      parts.push([plane(lc, 0, 0.5), new THREE.Matrix4().makeTranslation((cw / 2 + OUT) * MM, cy * MM, (-cd / 2 + lc / 2) * MM).multiply(rot.clone())]);
    } else {
      var ls = Math.min(LABEL_SIDE_LEN, cd * 0.85);
      rot.makeRotationY(Math.PI / 2);
      parts.push([plane(ls, 0, 1), new THREE.Matrix4().makeTranslation((cw / 2 + OUT) * MM, cy * MM, 0).multiply(rot.clone())]);
    }
    var m4c = new THREE.Matrix4(), q2 = new THREE.Quaternion(), upY = new THREE.Vector3(0, 1, 0), unit = new THREE.Vector3(1, 1, 1);
    parts.forEach(function (p) {
      var mesh = new THREE.InstancedMesh(p[0], labelMat, instances.length);
      instances.forEach(function (it, k) {
        q2.setFromAxisAngle(upY, it.yaw);
        m4c.compose(new THREE.Vector3(it.x * MM, (PALLET_HEIGHT + CASE_HEIGHT / 2) * MM, it.z * MM), q2, unit);
        mesh.setMatrixAt(k, m4c.clone().multiply(p[1]));
      });
      mesh.receiveShadow = true;
      scene.add(mesh);
    });
  }
  // depositi che non si riescono a dividere in casse: un unico blocco
  fallbackDeposits.forEach(function (f) {
    var m = new THREE.Mesh(new THREE.BoxGeometry((f.box.w - CASE_GAP) * MM, CASE_HEIGHT * MM, (f.box.h - CASE_GAP) * MM), caseMaterials);
    m.position.set(f.cx * MM, (PALLET_HEIGHT + CASE_HEIGHT / 2) * MM, f.cz * MM);
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  });

  // ===== ETICHETTE DEPOSITI (numero + tipo) =====
  var TYPE_COLORS = { A: "#ffb703", B: "#219ebc", AB: "#09b5a0" };
  var labels = new THREE.Group();
  state.boxes.forEach(function (box) {
    var c = document.createElement("canvas"); c.width = 160; c.height = 72;
    var g = c.getContext("2d");
    g.fillStyle = TYPE_COLORS[box.depositType] || "#666";
    g.beginPath(); g.roundRect(4, 4, 152, 64, 14); g.fill();
    g.lineWidth = 3; g.strokeStyle = "#023047"; g.stroke();
    g.fillStyle = "#023047"; g.font = "bold 38px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(box.id + " " + box.depositType, 80, 38);
    var t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
    var h = Math.min(box.w, box.h, 220) * 0.45 * MM;
    sp.scale.set(h * 160 / 72, h, 1);
    sp.position.set((box.x + box.w / 2 - palletW / 2 + state.Offset.x) * MM, (PALLET_HEIGHT + CASE_HEIGHT) * MM + h * 0.8,
                    -(box.y + box.h / 2 - palletH / 2 + state.Offset.y) * MM);
    sp.renderOrder = 10;
    labels.add(sp);
  });
  scene.add(labels);

  document.getElementById("info3D").textContent =
    (state.LayerType === "LayerB" ? "Layer B" : "Layer A") + " · " + state.boxes.length + " deposits · " + instances.length + " cases";

  // ===== ROBOT (solo se i modelli sono stati incorporati con tools/embed-models.bat) =====
  // Con l'ActiveX PalComposeBrowser la pagina è servita via https://palcompose.local/ e il modello si legge
  // direttamente dalla cartella, senza bisogno di models.js
  var animateRobot = null;
  var models = window.PALCOMPOSE_MODELS || {};
  var robotKey = Object.keys(models).filter(function (k) { return /\.obj$/i.test(k); })[0];
  if (!robotKey && window.PalComposeHost) {
    new THREE.OBJLoader().load("./Assets/3D/Rmk3.obj", function (obj) { setupRobot(obj); startLoop(); }, undefined, function () {});
  }
  if (robotKey) setupRobot(new THREE.OBJLoader().parse(atob(models[robotKey])));
  function setupRobot(robot) {
    robot.scale.setScalar(0.003);
    robot.position.set(-2, 0, -0.8);
    robot.traverse(function (child) {
      if (child.isMesh) { child.material = new THREE.MeshStandardMaterial({ color: 0xE6C200, metalness: 0.2, roughness: 0.5 }); child.castShadow = true; }
    });
    scene.add(robot);
    var base = robot.getObjectByName("__-_BASE__rotating_"), armPrime = robot.getObjectByName("__-_ARM__prime_");
    var armSecond = robot.getObjectByName("__-_ARM__second_"), armRot = robot.getObjectByName("__-_ARM__rotating_");
    var headRot = robot.getObjectByName("__-_HEAD__rotating_");
    var leftGrip = robot.getObjectByName("__-_GRIPS LEFT_GRIP"), rightGrip = robot.getObjectByName("__-_GRIPS RIGHT_GRIP");
    animateRobot = function () {
      var t = Date.now();
      if (base) base.rotation.y += 0.005;
      if (armPrime) armPrime.rotation.z = Math.sin(t * 0.001) * 0.5;
      if (armSecond) armSecond.rotation.z = Math.sin(t * 0.0015) * 0.3;
      if (armRot) armRot.rotation.y = Math.sin(t * 0.0012) * 0.5;
      if (headRot) headRot.rotation.z = Math.sin(t * 0.002) * 0.2;
      if (leftGrip && rightGrip) { leftGrip.rotation.y = Math.sin(t * 0.003) * 0.5; rightGrip.rotation.y = -Math.sin(t * 0.003) * 0.5; }
    };
  }

  // ===== RENDERING =====
  // Scena statica: si ridisegna solo quando la vista cambia (niente GPU occupata a vuoto).
  // Solo con il robot animato serve il ciclo continuo.
  var renderPending = false;
  function render() { renderPending = false; renderer.render(scene, camera); }
  function requestRender() { if (!renderPending) { renderPending = true; requestAnimationFrame(render); } }
  controls.addEventListener("change", requestRender);
  var loopRunning = false;
  function startLoop() {
    if (loopRunning || !animateRobot) return;
    loopRunning = true;
    (function loop() { requestAnimationFrame(loop); animateRobot(); renderer.render(scene, camera); })();
  }
  if (animateRobot) startLoop(); else requestRender();

  var topView = false;
  document.getElementById("btnTopView").onclick = function () {
    topView = !topView;
    if (topView) { camera.position.set(0, span * 2.2, 0.0001); controls.target.set(0, PALLET_HEIGHT * MM, 0); controls.update(); }
    else defaultView();
    this.className = (topView ? "defaultabilitato" : "defaultnormale") + " txtBtn";
    requestRender();
  };
  document.getElementById("btnLabels").onclick = function () {
    labels.visible = !labels.visible;
    this.className = (labels.visible ? "defaultabilitato" : "defaultnormale") + " txtBtn";
    requestRender();
  };

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    requestRender();
  });
})();
</script>
</body>
</html>
